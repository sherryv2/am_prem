<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adam.dev - AM Premium Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #c0c0c0;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #d4d0c8;
      border: 2px solid #ffffff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      padding: 12px;
      box-shadow: 2px 2px 0px #000000;
    }

    .header-bar {
      background-color: #000080;
      color: #ffffff;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.5px;
    }

    .header-bar span.brand {
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
    }

    fieldset {
      border: 2px solid #ffffff;
      border-left-color: #808080;
      border-top-color: #808080;
      background-color: #ece9d8;
      margin-bottom: 12px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 12px;
      background-color: #d4d0c8;
      border: 1px solid #808080;
      padding: 2px 6px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 6px;
      border: 2px inset #ffffff;
      background-color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 8px;
      background-color: #d4d0c8;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    button:active {
      border: 2px inset #ffffff;
    }

    button:disabled {
      color: #808080;
      cursor: not-allowed;
    }

    .output-box {
      width: 100%;
      height: 65px;
      margin-top: 6px;
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #808080;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #333333;
      margin-top: 8px;
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
    }

    @media (max-width: 360px) {
      body {
        padding: 4px;
      }
      .container {
        padding: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <span>[ AM ACTIVATOR ]</span>
      <span class="brand">adam.dev</span>
    </div>

    <!-- LANGKAH 1 -->
    <fieldset>
      <legend>Langkah 1: Kirim Link Verifikasi</legend>
      <div class="form-group">
        <label for="email1">EMAIL USER:</label>
        <input type="email" id="email1" placeholder="user@email.com" oninput="syncEmail()">
      </div>
      <button id="btn1" onclick="sendVerificationLink()">[ KIRIM EMAIL VERIFIKASI ]</button>
      <textarea id="output1" class="output-box" readonly>[ Status: Menunggu perintah... ]</textarea>
    </fieldset>

    <!-- LANGKAH 2 -->
    <fieldset>
      <legend>Langkah 2: Verifikasi & Apply Premium</legend>
      <div class="form-group">
        <label for="email2">EMAIL USER:</label>
        <input type="email" id="email2" placeholder="user@email.com">
      </div>
      <div class="form-group">
        <label for="link2">LINK VERIFIKASI DARI EMAIL:</label>
        <input type="text" id="link2" placeholder="https://alightcreative.com/auth_...">
      </div>
      <button id="btn2" onclick="verifyAndApply()">[ AKTIFKAN PREMIUM ]</button>
      <textarea id="output2" class="output-box" readonly>[ Status: Menunggu perintah... ]</textarea>
    </fieldset>

    <div class="footer">
      Powered by adam.dev
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.alwayscodex.eu.cc';

    function syncEmail() {
      document.getElementById('email2').value = document.getElementById('email1').value;
    }

    // Langkah 1: /api/am/sendv2
    async function sendVerificationLink() {
      const email = document.getElementById('email1').value.trim();
      const out = document.getElementById('output1');
      const btn = document.getElementById('btn1');

      if (!email) {
        alert("Harap isi email terlebih dahulu!");
        return;
      }

      btn.disabled = true;
      out.value = "CONNECTING...\nMeminta pengiriman email...";

      try {
        const url = `${API_BASE}/api/am/sendv2?email=${encodeURIComponent(email)}`;
        
        // no-cors agar request tetap jalan tanpa error 'Failed to fetch' di browser
        await fetch(url, { mode: 'no-cors' });

        out.value = "SUCCESS!\nPermintaan terkirim ke server. Silakan cek inbox/spam email Anda.";
      } catch (err) {
        out.value = `ERROR:\n${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    // Langkah 2: /api/am/verifv2
    async function verifyAndApply() {
      const email = document.getElementById('email2').value.trim();
      const link = document.getElementById('link2').value.trim();
      const out = document.getElementById('output2');
      const btn = document.getElementById('btn2');

      if (!email || !link) {
        alert("Email dan Link verifikasi wajib diisi!");
        return;
      }

      btn.disabled = true;
      out.value = "CONNECTING...\nMemproses aktivasi premium...";

      try {
        const url = `${API_BASE}/api/am/verifv2?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`;
        
        await fetch(url, { mode: 'no-cors' });

        out.value = "SUCCESS!\nProses verifikasi berhasil dikirim. Silakan cek akun Alight Motion Anda.";
      } catch (err) {
        out.value = `ERROR:\n${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
