<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adam.dev - 1-Click AM Activator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #c0c0c0;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #d4d0c8;
      border: 2px solid #ffffff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      padding: 12px;
      box-shadow: 2px 2px 0px #000000;
    }

    .header-bar {
      background-color: #000080;
      color: #ffffff;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-bar span.brand {
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
    }

    fieldset {
      border: 2px solid #ffffff;
      border-left-color: #808080;
      border-top-color: #808080;
      background-color: #ece9d8;
      margin-bottom: 12px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 11px;
      background-color: #d4d0c8;
      border: 1px solid #808080;
      padding: 2px 6px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 6px;
      border: 2px inset #ffffff;
      background-color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      outline: none;
    }

    .btn-main {
      width: 100%;
      padding: 10px;
      background-color: #008000;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-secondary {
      width: 100%;
      padding: 6px;
      background-color: #d4d0c8;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-action {
      width: 100%;
      padding: 8px;
      background-color: #000080;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    button:active {
      border: 2px inset #ffffff;
    }

    button:disabled {
      background-color: #808080 !important;
      color: #c0c0c0 !important;
      cursor: not-allowed;
    }

    .output-box {
      width: 100%;
      height: 120px;
      margin-top: 4px;
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #808080;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .inbox-box {
      width: 100%;
      height: 80px;
      margin-top: 4px;
      background-color: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #ffffff;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #333333;
      margin-top: 6px;
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <span>[ AM AUTO ACTIVATOR ]</span>
      <span class="brand">adam.dev</span>
    </div>

    <!-- OTOMATISASI 1-KLIK -->
    <fieldset>
      <legend>Otomatisasi 1-Klik</legend>
      <button id="btnStart" class="btn-main" onclick="startFullAutomation()">[ 🚀 BUAT & AKTIFKAN AKUN ]</button>
    </fieldset>

    <!-- DETAIL AKUN -->
    <fieldset>
      <legend>Detail Akun Terbuat</legend>
      <div class="form-group">
        <label for="activeEmail">EMAIL AKUN AM PREMIUM:</label>
        <input type="email" id="activeEmail" placeholder="Ketik/Paste atau klik buat otomatis...">
      </div>
      <button id="btnCopy" class="btn-secondary" onclick="copyEmail()">[ 📋 COPY EMAIL ]</button>
    </fieldset>

    <!-- INBOX & MANUAL LINK -->
    <fieldset>
      <legend>Akses Inbox & Paste Link Manual</legend>
      <button id="btnCheckInbox" class="btn-secondary" onclick="checkInboxManual()">[ 📥 CEK PESAN MASUK ]</button>
      <button id="btnProcessInbox" class="btn-action" onclick="processExistingInbox()">[ ⚡ PROSES DARI INBOX ]</button>
      <textarea id="inboxView" class="inbox-box" readonly>[ Klik 'CEK PESAN MASUK' untuk membaca email... ]</textarea>

      <div class="form-group" style="margin-top: 8px;">
        <label for="manualLink">LINK VERIFIKASI TERDETEKSI / PASTE:</label>
        <input type="text" id="manualLink" placeholder="https://alightcreative.com/auth_...">
      </div>
      <button id="btnManualVerif" class="btn-secondary" onclick="executeManualLink()">[ 🔑 AKTIFKAN LINK TERSEBUT ]</button>
    </fieldset>

    <!-- CONSOLE LOG -->
    <fieldset>
      <legend>Console Log</legend>
      <textarea id="consoleLog" class="output-box" readonly>[ Ready. Klik 'BUAT & AKTIFKAN AKUN' untuk mulai. ]</textarea>
    </fieldset>

    <div class="footer">
      System Automated &bull; adam.dev
    </div>
  </div>

  <script>
    const TARGET_API = 'https://api.alwayscodex.eu.cc';

    function log(msg) {
      const consoleBox = document.getElementById('consoleLog');
      consoleBox.value += `\n> ${msg}`;
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    // MULTI-FALLBACK FETCH ENGINE (Anti-CORS & Anti-Stuck)
    async function fetchRobust(url) {
      // 1. Direct fetch
      try {
        const res = await fetch(url);
        if (res.ok) {
          const text = await res.text();
          try { return JSON.parse(text); } catch(e) { return text; }
        }
      } catch(e) {}

      // 2. Vercel Rewrite Proxy
      if (window.location.hostname.includes('vercel.app')) {
        try {
          const proxyPath = url.replace(TARGET_API, '/backend-api');
          const res = await fetch(proxyPath);
          if (res.ok) {
            const text = await res.text();
            try { return JSON.parse(text); } catch(e) { return text; }
          }
        } catch(e) {}
      }

      // 3. CORS Proxy IO
      try {
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        if (res.ok) {
          const text = await res.text();
          try { return JSON.parse(text); } catch(e) { return text; }
        }
      } catch(e) {}

      // 4. AllOrigins Proxy
      try {
        const proxyUrl2 = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl2);
        if (res.ok) {
          const text = await res.text();
          try { return JSON.parse(text); } catch(e) { return text; }
        }
      } catch(e) {}

      throw new Error("Gagal terhubung ke API. Periksa koneksi internet Anda.");
    }

    // EXTRACTION LINK VERIFIKASI ALIGHT CREATIVE
    function extractLinkFromInbox(dataInbox) {
      if (!dataInbox) return null;
      let str = typeof dataInbox === 'string' ? dataInbox : JSON.stringify(dataInbox);

      // Clean HTML & escaped characters
      str = str.replace(/\\\/g, '/')
               .replace(/\\n/gi, ' ')
               .replace(/\\r/gi, ' ')
               .replace(/\\"/g, '"')
               .replace(/=3D/gi, '=')
               .replace(/=\r?\n/g, '')
               .replace(/&amp;/g, '&')
               .replace(/&quot;/g, '"')
               .replace(/&lt;/g, '<')
               .replace(/&gt;/g, '>');

      // Find all URLs
      const urls = str.match(/https?:\/\/[^\s"'<>\\\]\[\}(\)]+/gi) || [];

      for (let u of urls) {
        let clean = u.replace(/["';,>)]+$/, '');
        let lower = clean.toLowerCase();

        if ((lower.includes('alight') || lower.includes('firebase') || lower.includes('oobcode') || lower.includes('auth')) &&
            !lower.includes('alwayscodex') && !lower.includes('1timetech') && !lower.includes('corsproxy') && !lower.includes('allorigins') && !lower.includes('vercel')) {
          return clean;
        }
      }

      for (let u of urls) {
        let clean = u.replace(/["';,>)]+$/, '');
        let lower = clean.toLowerCase();
        if ((lower.includes('oobcode') || lower.includes('mode=') || lower.includes('signin')) &&
            !lower.includes('alwayscodex') && !lower.includes('1timetech')) {
          return clean;
        }
      }

      return null;
    }

    // 1. AUTOMATION
    async function startFullAutomation() {
      const btn = document.getElementById('btnStart');
      const emailInput = document.getElementById('activeEmail');

      btn.disabled = true;
      btn.innerText = "[ ⏳ SEDANG MEMPROSES... ]";
      log("Memulai proses otomatisasi...");

      try {
        // Step 1: Create Email
        log("[1/4] Membuat email temporary baru...");
        const data1 = await fetchRobust(`${TARGET_API}/api/tempmail/1timetech?action=create`);
        
        let createdEmail = null;
        if (typeof data1 === 'object') {
          if (data1.result && data1.result.email) createdEmail = data1.result.email;
          else if (data1.email) createdEmail = data1.email;
        }

        if (!createdEmail) throw new Error("Gagal membuat email temporary.");

        emailInput.value = createdEmail;
        log(`[1/4] Email berhasil dibuat: ${createdEmail}`);

        // Step 2: Request Link
        log("[2/4] Mengirim request verifikasi Alight Motion...");
        await fetchRobust(`${TARGET_API}/api/am/sendv2?email=${encodeURIComponent(createdEmail)}`);
        log("[2/4] Link verifikasi berhasil dikirim ke email!");

        // Step 3: Poll Inbox
        log("[3/4] Menunggu pesan di inbox (auto-check 10x)...");
        let foundLink = null;
        let attempts = 0;

        while (attempts < 10 && !foundLink) {
          attempts++;
          await new Promise(r => setTimeout(r, 3000));

          try {
            const dataInbox = await fetchRobust(`${TARGET_API}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(createdEmail)}`);
            document.getElementById('inboxView').value = typeof dataInbox === 'object' ? JSON.stringify(dataInbox, null, 2) : dataInbox;

            foundLink = extractLinkFromInbox(dataInbox);

            if (foundLink) {
              log("[3/4] Link verifikasi berhasil diekstrak dari pesan!");
              document.getElementById('manualLink').value = foundLink;
            } else {
              log(`[3/4] Check ke-${attempts}/10... membaca inbox.`);
            }
          } catch(e) {
            log(`[3/4] Check ke-${attempts}... mengulang.`);
          }
        }

        if (!foundLink) {
          log("⚠️ Pengecekan otomatis selesai. Jika email sudah masuk di bawah, klik '[ ⚡ PROSES DARI INBOX ]'.");
          return;
        }

        // Step 4: Activate
        await executeActivation(createdEmail, foundLink);

      } catch(err) {
        log(`❌ ERROR: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerText = "[ 🚀 BUAT & AKTIFKAN AKUN ]";
      }
    }

    // 2. CHECK INBOX MANUAL
    async function checkInboxManual() {
      const email = document.getElementById('activeEmail').value.trim();
      const inboxView = document.getElementById('inboxView');

      if (!email) return alert("Harap isi atau buat email terlebih dahulu!");

      inboxView.value = "Memuat isi inbox...";
      log(`Mengecek inbox untuk email: ${email}`);

      try {
        const data = await fetchRobust(`${TARGET_API}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(email)}`);
        inboxView.value = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;

        const link = extractLinkFromInbox(data);
        if (link) {
          document.getElementById('manualLink').value = link;
          log("Link verifikasi terdeteksi dan diisi otomatis!");
        } else {
          log("Pesan inbox dimuat. Belum ada link terdeteksi.");
        }
      } catch(err) {
        inboxView.value = "Gagal membaca inbox.";
        log(`❌ ERROR: ${err.message}`);
      }
    }

    // 3. PROSES DARI INBOX
    async function processExistingInbox() {
      const email = document.getElementById('activeEmail').value.trim();
      const btn = document.getElementById('btnProcessInbox');

      if (!email) return alert("Harap isi atau buat email terlebih dahulu!");

      btn.disabled = true;
      btn.innerText = "[ ⏳ MEMPROSES... ]";
      log("Mengekstrak link dari inbox...");

      try {
        const dataInbox = await fetchRobust(`${TARGET_API}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(email)}`);
        document.getElementById('inboxView').value = typeof dataInbox === 'object' ? JSON.stringify(dataInbox, null, 2) : dataInbox;

        const foundLink = extractLinkFromInbox(dataInbox);
        if (!foundLink) throw new Error("Link verifikasi belum terdeteksi. Silakan tekan 'CEK PESAN MASUK'.");

        document.getElementById('manualLink').value = foundLink;
        await executeActivation(email, foundLink);

      } catch(err) {
        log(`❌ ERROR: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerText = "[ ⚡ PROSES DARI INBOX ]";
      }
    }

    // 4. MANUAL LINK ACTIVATION
    async function executeManualLink() {
      const email = document.getElementById('activeEmail').value.trim();
      const link = document.getElementById('manualLink').value.trim();

      if (!email || !link) return alert("Email dan Link verifikasi wajib diisi!");

      log("Memproses aktivasi via link manual...");
      await executeActivation(email, link);
    }

    // 5. ACTIVATION EXECUTION
    async function executeActivation(email, link) {
      log("[4/4] Memproses aktivasi Premium...");
      const verifUrl = `${TARGET_API}/api/am/verifv2?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`;

      try {
        await fetchRobust(verifUrl);
      } catch(e) {
        // Fallback send if proxy blocks response
        await fetch(verifUrl, { mode: 'no-cors' });
      }

      log("==========================================");
      log("🎉 SUKSES! AKUN PREMIUM BERHASIL AKTIF!");
      log("==========================================");
    }

    function copyEmail() {
      const emailInput = document.getElementById('activeEmail');
      if (!emailInput.value) return alert("Email kosong!");
      navigator.clipboard.writeText(emailInput.value);
      alert("Email berhasil di-copy!");
    }
  </script>
</body>
</html>
