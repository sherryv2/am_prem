<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Premium Activator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: flex-start;
            padding-top: 5vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .step-badge {
            display: inline-block;
            background-color: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .card p.desc {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 14px;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .message-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .msg-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .msg-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>AM Premium</h1>
            <p>Aktivasi akun Alight Motion kamu sekarang</p>
        </div>

        <div class="card">
            <span class="step-badge">Langkah 1</span>
            <h2>Kirim Link Login</h2>
            <p class="desc">Masukkan email akun kamu. Kami akan mengirimkan link verifikasi dari Firebase.</p>
            
            <form id="formSend">
                <div class="form-group">
                    <input type="email" id="sendEmail" placeholder="Masukkan alamat email..." required>
                </div>
                <button type="submit" id="btnSend">Kirim Email Verifikasi</button>
            </form>
            <div id="resSend" class="message-box"></div>
        </div>

        <div class="card">
            <span class="step-badge">Langkah 2</span>
            <h2>Aktivasi Premium</h2>
            <p class="desc">Cek inbox email kamu, salin link login yang masuk, lalu tempel (paste) di bawah ini.</p>
            
            <form id="formVerif">
                <div class="form-group">
                    <input type="email" id="verifEmail" placeholder="Email kamu tadi..." required>
                </div>
                <div class="form-group">
                    <input type="text" id="verifLink" placeholder="Paste link dari email (https://...)" required>
                </div>
                <button type="submit" id="btnVerif">Proses Aktivasi</button>
            </form>
            <div id="resVerif" class="message-box"></div>
        </div>
    </div>

    <script>
        function showMessage(elementId, text, isError = false) {
            const el = document.getElementById(elementId);
            el.style.display = "block";
            el.className = `message-box ${isError ? 'msg-error' : 'msg-success'}`;
            el.textContent = text;
        }

        // Handle Langkah 1: Kirim Email
        document.getElementById('formSend').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('sendEmail').value;
            const btn = document.getElementById('btnSend');
            const resArea = 'resSend';

            btn.disabled = true;
            btn.textContent = "Memproses...";
            document.getElementById(resArea).style.display = "none";

            try {
                // Fetch langsung ke path Vercel (CORS dihandle oleh vercel.json)
                const targetUrl = `/api/am/sendv2?email=${encodeURIComponent(email)}`;
                const response = await fetch(targetUrl);
                
                const result = await response.json();
                
                if (!response.ok) throw new Error(result.message || "Gagal menghubungi server API.");
                
                showMessage(resArea, result.message || "Berhasil! Silakan cek email kamu sekarang.");
                
                // Auto-isi email di form langkah 2
                document.getElementById('verifEmail').value = email;
            } catch (error) {
                showMessage(resArea, "Error: " + error.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = "Kirim Email Verifikasi";
            }
        });

        // Handle Langkah 2: Verifikasi Link
        document.getElementById('formVerif').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('verifEmail').value;
            const link = document.getElementById('verifLink').value;
            const btn = document.getElementById('btnVerif');
            const resArea = 'resVerif';

            btn.disabled = true;
            btn.textContent = "Memverifikasi...";
            document.getElementById(resArea).style.display = "none";

            try {
                // Fetch langsung ke path Vercel
                const targetUrl = `/api/am/verifv2?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`;
                const response = await fetch(targetUrl);
                
                const result = await response.json();

                if (!response.ok) throw new Error(result.message || "Gagal menghubungi server API.");
                
                showMessage(resArea, result.message || "Aktivasi Sukses! Premium berhasil diaplikasikan.");
            } catch (error) {
                showMessage(resArea, "Error: " + error.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = "Proses Aktivasi";
            }
        });
    </script>
</body>
</html>
