<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adam.dev - 1-Click AM Activator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #c0c0c0;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #d4d0c8;
      border: 2px solid #ffffff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      padding: 12px;
      box-shadow: 2px 2px 0px #000000;
    }

    .header-bar {
      background-color: #000080;
      color: #ffffff;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-bar span.brand {
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
    }

    fieldset {
      border: 2px solid #ffffff;
      border-left-color: #808080;
      border-top-color: #808080;
      background-color: #ece9d8;
      margin-bottom: 12px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 11px;
      background-color: #d4d0c8;
      border: 1px solid #808080;
      padding: 2px 6px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 6px;
      border: 2px inset #ffffff;
      background-color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      outline: none;
    }

    .btn-main {
      width: 100%;
      padding: 10px;
      background-color: #008000;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-secondary {
      width: 100%;
      padding: 6px;
      background-color: #d4d0c8;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    button:active {
      border: 2px inset #ffffff;
    }

    button:disabled {
      background-color: #808080;
      color: #c0c0c0;
      cursor: not-allowed;
    }

    .output-box {
      width: 100%;
      height: 120px;
      margin-top: 4px;
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #808080;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .inbox-box {
      width: 100%;
      height: 80px;
      margin-top: 4px;
      background-color: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #ffffff;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #333333;
      margin-top: 6px;
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <span>[ AM AUTO ACTIVATOR ]</span>
      <span class="brand">adam.dev</span>
    </div>

    <!-- 1-CLICK AUTOMATION -->
    <fieldset>
      <legend>Otomatisasi 1-Klik</legend>
      <button id="btnStart" class="btn-main" onclick="startFullAutomation()">[ 🚀 BUAT & AKTIFKAN AKUN ]</button>
    </fieldset>

    <!-- DETAIL AKUN -->
    <fieldset>
      <legend>Detail Akun Terbuat</legend>
      <div class="form-group">
        <label for="activeEmail">EMAIL AKUN AM PREMIUM:</label>
        <input type="email" id="activeEmail" placeholder="Belum ada akun terbuat..." readonly>
      </div>
      <button id="btnCopy" class="btn-secondary" onclick="copyEmail()" disabled>[ 📋 COPY EMAIL ]</button>
    </fieldset>

    <!-- INBOX VIEW -->
    <fieldset>
      <legend>Akses Inbox Email (Minta Login)</legend>
      <button id="btnCheckInbox" class="btn-secondary" onclick="checkInboxManual()" disabled>[ 📥 CEK PESAN MASUK ]</button>
      <textarea id="inboxView" class="inbox-box" readonly>[ Klik 'CEK PESAN MASUK' untuk membaca email... ]</textarea>
    </fieldset>

    <!-- LOG CONSOLE -->
    <fieldset>
      <legend>Console Log</legend>
      <textarea id="consoleLog" class="output-box" readonly>[ Ready. Klik 'BUAT & AKTIFKAN AKUN' untuk mulai. ]</textarea>
    </fieldset>

    <div class="footer">
      System Automated &bull; adam.dev
    </div>
  </div>

  <script>
    // Memakai Vercel Rewrite Proxy (/backend-api) agar bebas CORS
    const PROXY_BASE = window.location.hostname.includes('vercel.app') 
      ? '/backend-api' 
      : 'https://api.alwayscodex.eu.cc';

    function log(msg) {
      const consoleBox = document.getElementById('consoleLog');
      consoleBox.value += `\n> ${msg}`;
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    async function startFullAutomation() {
      const btn = document.getElementById('btnStart');
      const emailInput = document.getElementById('activeEmail');
      const consoleBox = document.getElementById('consoleLog');

      btn.disabled = true;
      consoleBox.value = "[ MEMULAI PROSES... ]";
      emailInput.value = "";

      try {
        // STEP 1: Create Email
        log("[1/4] Membuat temp email...");
        const createUrl = `${PROXY_BASE}/api/tempmail/1timetech?action=create`;
        
        const res1 = await fetch(createUrl);
        const data1 = await res1.json();

        // Mengambil email berdasarkan skema JSON: data1.result.email
        let createdEmail = data1.result ? data1.result.email : null;

        if (!createdEmail) {
          throw new Error("Gagal mengambil email dari response API.");
        }

        emailInput.value = createdEmail;
        document.getElementById('btnCopy').disabled = false;
        document.getElementById('btnCheckInbox').disabled = false;

        log(`[1/4] Email berhasil dibuat: ${createdEmail}`);

        // STEP 2: Send Link
        log("[2/4] Mengirim request link verifikasi ke Alight Motion...");
        const sendUrl = `${PROXY_BASE}/api/am/sendv2?email=${encodeURIComponent(createdEmail)}`;
        await fetch(sendUrl);
        log("[2/4] Request berhasil dikirim.");

        // STEP 3: Poll Inbox
        log("[3/4] Menunggu email masuk (auto-check setiap 3 detik)...");
        let foundLink = null;
        let attempts = 0;

        while (attempts < 10 && !foundLink) {
          attempts++;
          await new Promise(r => setTimeout(r, 3000));

          try {
            const inboxUrl = `${PROXY_BASE}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(createdEmail)}`;
            const resInbox = await fetch(inboxUrl);
            const dataInbox = await resInbox.json();

            const str = JSON.stringify(dataInbox);
            const match = str.match(/https?:\/\/[^\s"'\\]*(alight|auth)[^\s"'\\]*/i);

            if (match) {
              foundLink = match[0].replace(/\\/g, '');
              log(`[3/4] Link verifikasi ditemukan!`);
            } else {
              log(`[3/4] Pengecekan ke-${attempts}... belum ada pesan.`);
            }
          } catch (e) {
            log(`[3/4] Mengulang pengecekan ke-${attempts}...`);
          }
        }

        if (!foundLink) {
          throw new Error("Pesan dari Alight Motion belum masuk. Silakan coba cek inbox manual nanti.");
        }

        // STEP 4: Activate
        log("[4/4] Memproses aktivasi Premium...");
        const verifUrl = `${PROXY_BASE}/api/am/verifv2?email=${encodeURIComponent(createdEmail)}&link=${encodeURIComponent(foundLink)}`;
        await fetch(verifUrl);

        log("==========================================");
        log("🎉 SUKSES! Akun Premium Berhasil Aktif!");
        log("==========================================");

      } catch (err) {
        log(`❌ ERROR: ${err.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    async function checkInboxManual() {
      const email = document.getElementById('activeEmail').value.trim();
      const inboxView = document.getElementById('inboxView');

      if (!email) return alert("Belum ada email!");

      inboxView.value = "Memuat inbox...";
      try {
        const inboxUrl = `${PROXY_BASE}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(email)}`;
        const res = await fetch(inboxUrl);
        const data = await res.json();
        inboxView.value = JSON.stringify(data, null, 2);
      } catch (err) {
        inboxView.value = "Gagal memuat pesan inbox.";
      }
    }

    function copyEmail() {
      const emailInput = document.getElementById('activeEmail');
      navigator.clipboard.writeText(emailInput.value);
      alert("Email berhasil di-copy!");
    }
  </script>
</body>
</html>
