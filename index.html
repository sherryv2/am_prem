<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adam.dev - 1-Click AM Activator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #c0c0c0;
      font-family: Arial, sans-serif;
      color: #000000;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #d4d0c8;
      border: 2px solid #ffffff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      padding: 12px;
      box-shadow: 2px 2px 0px #000000;
    }

    .header-bar {
      background-color: #000080;
      color: #ffffff;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-bar span.brand {
      color: #00ff00;
      font-family: monospace;
    }

    fieldset {
      border: 2px solid #ffffff;
      border-left-color: #808080;
      border-top-color: #808080;
      background-color: #ece9d8;
      margin-bottom: 12px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 11px;
      background-color: #d4d0c8;
      border: 1px solid #808080;
      padding: 2px 6px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 6px;
      border: 2px inset #ffffff;
      background-color: #ffffff;
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #008000;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-secondary {
      background-color: #d4d0c8;
      color: #000000;
      padding: 6px;
      font-size: 11px;
    }

    .btn-action {
      background-color: #000080;
      color: #ffffff;
      padding: 8px;
      font-size: 11px;
    }

    button:active {
      border: 2px inset #ffffff;
    }

    .output-box {
      width: 100%;
      height: 120px;
      margin-top: 4px;
      background-color: #000000;
      color: #00ff00;
      font-family: monospace;
      font-size: 11px;
      border: 2px inset #808080;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .inbox-box {
      width: 100%;
      height: 80px;
      margin-top: 4px;
      background-color: #ffffff;
      color: #000000;
      font-family: monospace;
      font-size: 11px;
      border: 2px inset #ffffff;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #333333;
      margin-top: 6px;
      font-family: monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <span>[ AM AUTO ACTIVATOR ]</span>
      <span class="brand">adam.dev</span>
    </div>

    <!-- PENGATURAN MAIL PROVIDER -->
    <fieldset>
      <legend>Provider Email</legend>
      <div class="form-group">
        <select id="mailProvider">
          <option value="boomlify">Boomlify (Full HTML Mail - Recommended)</option>
          <option value="1timetech">1TimeTech (Snippet Mail)</option>
        </select>
      </div>
    </fieldset>

    <!-- OTOMATISASI 1-KLIK -->
    <fieldset>
      <legend>Otomatisasi 1-Klik</legend>
      <button type="button" id="btnStart" onclick="handleStartAutomation()">[ 🚀 BUAT & AKTIFKAN AKUN ]</button>
    </fieldset>

    <!-- DETAIL AKUN -->
    <fieldset>
      <legend>Detail Akun Terbuat</legend>
      <div class="form-group">
        <label for="activeEmail">EMAIL AKUN AM PREMIUM:</label>
        <input type="email" id="activeEmail" placeholder="Belum ada akun...">
      </div>
      <button type="button" class="btn-secondary" onclick="handleCopyEmail()">[ 📋 COPY EMAIL ]</button>
    </fieldset>

    <!-- INBOX VIEW -->
    <fieldset>
      <legend>Akses Inbox & Link Manual</legend>
      <button type="button" class="btn-secondary" onclick="handleCheckInbox()">[ 📥 CEK PESAN MASUK ]</button>
      <button type="button" class="btn-action" onclick="handleProcessInbox()">[ ⚡ PROSES DARI INBOX ]</button>
      <textarea id="inboxView" class="inbox-box" readonly>[ Klik 'CEK PESAN MASUK' untuk membaca email... ]</textarea>

      <div class="form-group" style="margin-top: 8px;">
        <label for="manualLink">LINK VERIFIKASI TERDETEKSI / PASTE:</label>
        <input type="text" id="manualLink" placeholder="https://alightcreative.com/auth_...">
      </div>
      <button type="button" class="btn-secondary" onclick="handleExecuteManualLink()">[ 🔑 AKTIFKAN LINK TERSEBUT ]</button>
    </fieldset>

    <!-- CONSOLE LOG -->
    <fieldset>
      <legend>Console Log</legend>
      <textarea id="consoleLog" class="output-box" readonly>[ Status: Siap. Klik tombol hijau di atas. ]</textarea>
    </fieldset>

    <div class="footer">
      System Automated &bull; adam.dev
    </div>
  </div>

  <script>
    var API_HOST = 'https://api.alwayscodex.eu.cc';

    function writeLog(text) {
      var box = document.getElementById('consoleLog');
      if (box) {
        box.value += "\n> " + text;
        box.scrollTop = box.scrollHeight;
      }
    }

    function getProvider() {
      var p = document.getElementById('mailProvider');
      return p ? p.value : 'boomlify';
    }

    function apiFetch(endpoint, callback) {
      var targetUrl = API_HOST + endpoint;
      
      if (window.location.hostname.indexOf('vercel.app') !== -1) {
        targetUrl = '/backend-api' + endpoint;
      }

      fetch(targetUrl)
        .then(function(res) { return res.text(); })
        .then(function(text) {
          try { callback(null, JSON.parse(text)); } catch(e) { callback(null, text); }
        })
        .catch(function(err) {
          var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(API_HOST + endpoint);
          fetch(proxyUrl)
            .then(function(res) { return res.text(); })
            .then(function(text) {
              try { callback(null, JSON.parse(text)); } catch(e) { callback(null, text); }
            })
            .catch(function(pErr) {
              callback(pErr, null);
            });
        });
    }

    // Ekstraksi Link Menggunakan Regex Rekursif Lengkap
    function findLinkInObject(obj) {
      if (!obj) return null;
      var str = typeof obj === 'string' ? obj : JSON.stringify(obj);

      // Clean unescaped slashes & HTML codes
      str = str.split('\\/').join('/')
               .split('\\"').join('"')
               .split('\\n').join(' ')
               .split('=3D').join('=')
               .split('&amp;').join('&')
               .split('&quot;').join('"');

      var matches = str.match(/https?:\/\/[^\s"'<>\\\]\[\}(\)]+/gi) || [];

      for (var i = 0; i < matches.length; i++) {
        var cleanUrl = matches[i].replace(/[";,>)\.]+$/, '');
        var lower = cleanUrl.toLowerCase();

        if ((lower.indexOf('alight') !== -1 || lower.indexOf('firebase') !== -1 || lower.indexOf('oobcode') !== -1 || lower.indexOf('auth') !== -1) &&
            lower.indexOf('alwayscodex') === -1 && lower.indexOf('1timetech') === -1 && lower.indexOf('boomlify') === -1) {
          return cleanUrl;
        }
      }
      return null;
    }

    // PROSES UTAMA
    function handleStartAutomation() {
      var btn = document.getElementById('btnStart');
      var emailInput = document.getElementById('activeEmail');
      var provider = getProvider();

      btn.disabled = true;
      btn.innerText = "[ ⏳ MEMPROSES... ]";
      btn.style.backgroundColor = "#555555";
      
      document.getElementById('consoleLog').value = "[ PROSES DIMULAI - Provider: " + provider + " ]";
      writeLog("Menghubungi server tempmail...");

      // Step 1: Create Email
      apiFetch('/api/tempmail/' + provider + '?action=create', function(err1, data1) {
        if (err1) {
          writeLog("❌ Gagal terhubung ke API TempMail.");
          resetStartButton();
          return;
        }

        var newEmail = null;
        if (typeof data1 === 'object' && data1 !== null) {
          if (data1.result && data1.result.email) newEmail = data1.result.email;
          else if (data1.email) newEmail = data1.email;
        }

        if (!newEmail) {
          writeLog("❌ Gagal mendapatkan email baru.");
          resetStartButton();
          return;
        }

        emailInput.value = newEmail;
        writeLog("[1/4] Email dibuat: " + newEmail);

        // Step 2: Send Link
        writeLog("[2/4] Mengirim request verifikasi ke Alight Motion...");
        apiFetch('/api/am/sendv2?email=' + encodeURIComponent(newEmail), function(err2, data2) {
          writeLog("[2/4] Request verifikasi terkirim!");

          // Step 3: Poll Inbox
          writeLog("[3/4] Menunggu email masuk (auto-check 8x)...");
          var attempts = 0;
          var maxAttempts = 8;

          var pollInterval = setInterval(function() {
            attempts++;
            writeLog("[3/4] Mengecek inbox (" + attempts + "/" + maxAttempts + ")...");

            apiFetch('/api/tempmail/' + provider + '?action=inbox&email=' + encodeURIComponent(newEmail), function(errInbox, dataInbox) {
              if (dataInbox) {
                document.getElementById('inboxView').value = typeof dataInbox === 'object' ? JSON.stringify(dataInbox, null, 2) : dataInbox;
                
                var foundLink = findLinkInObject(dataInbox);

                // Jika 1timetech terpotong, coba panggil detail ID
                if (!foundLink && provider === '1timetech' && dataInbox.result && dataInbox.result.length > 0) {
                  var msgId = dataInbox.result[0].id || dataInbox.result[0].mailId;
                  if (msgId) {
                    apiFetch('/api/tempmail/1timetech?action=read&id=' + encodeURIComponent(msgId), function(eR, dR) {
                      var linkDetail = findLinkInObject(dR);
                      if (linkDetail) foundLink = linkDetail;
                    });
                  }
                }

                if (foundLink) {
                  clearInterval(pollInterval);
                  writeLog("[3/4] Link verifikasi berhasil ditemukan!");
                  document.getElementById('manualLink').value = foundLink;

                  // Step 4: Activate
                  writeLog("[4/4] Memproses aktivasi Premium...");
                  apiFetch('/api/am/verifv2?email=' + encodeURIComponent(newEmail) + '&link=' + encodeURIComponent(foundLink), function(errVerif, dataVerif) {
                    writeLog("==========================================");
                    writeLog("🎉 SUKSES! AKUN PREMIUM BERHASIL AKTIF!");
                    writeLog("==========================================");
                    resetStartButton();
                  });
                }
              }

              if (attempts >= maxAttempts && !foundLink) {
                clearInterval(pollInterval);
                writeLog("⚠️ Pengecekan otomatis selesai. Jika pesan masuk, klik '[ ⚡ PROSES DARI INBOX ]'.");
                resetStartButton();
              }
            }, 3000);
          }, 3000);
        });
      });
    }

    function resetStartButton() {
      var btn = document.getElementById('btnStart');
      btn.disabled = false;
      btn.innerText = "[ 🚀 BUAT & AKTIFKAN AKUN ]";
      btn.style.backgroundColor = "#008000";
    }

    function handleCheckInbox() {
      var email = document.getElementById('activeEmail').value.trim();
      var provider = getProvider();
      if (!email) return alert("Isi atau buat email terlebih dahulu!");

      writeLog("Mengecek inbox...");
      apiFetch('/api/tempmail/' + provider + '?action=inbox&email=' + encodeURIComponent(email), function(err, data) {
        if (err) return writeLog("❌ Gagal membaca inbox.");
        document.getElementById('inboxView').value = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
        
        var link = findLinkInObject(data);
        if (link) {
          document.getElementById('manualLink').value = link;
          writeLog("Link terdeteksi!");
        } else {
          writeLog("Inbox dimuat. Belum ada link.");
        }
      });
    }

    function handleProcessInbox() {
      var email = document.getElementById('activeEmail').value.trim();
      var provider = getProvider();
      if (!email) return alert("Isi atau buat email terlebih dahulu!");

      writeLog("Mengekstrak link...");
      apiFetch('/api/tempmail/' + provider + '?action=inbox&email=' + encodeURIComponent(email), function(err, data) {
        var link = findLinkInObject(data);
        if (!link) return writeLog("❌ Link belum terdeteksi. Silakan tekan 'CEK PESAN MASUK'.");

        document.getElementById('manualLink').value = link;
        writeLog("[4/4] Memproses aktivasi Premium...");
        apiFetch('/api/am/verifv2?email=' + encodeURIComponent(email) + '&link=' + encodeURIComponent(link), function(errV, dataV) {
          writeLog("==========================================");
          writeLog("🎉 SUKSES! AKUN PREMIUM BERHASIL AKTIF!");
          writeLog("==========================================");
        });
      });
    }

    function handleExecuteManualLink() {
      var email = document.getElementById('activeEmail').value.trim();
      var link = document.getElementById('manualLink').value.trim();

      if (!email || !link) return alert("Email dan Link wajib diisi!");

      writeLog("Memproses aktivasi via link manual...");
      apiFetch('/api/am/verifv2?email=' + encodeURIComponent(email) + '&link=' + encodeURIComponent(link), function(err, data) {
        writeLog("==========================================");
        writeLog("🎉 SUKSES! AKUN PREMIUM BERHASIL AKTIF!");
        writeLog("==========================================");
      });
    }

    function handleCopyEmail() {
      var emailInput = document.getElementById('activeEmail');
      if (!emailInput.value) return alert("Email kosong!");
      emailInput.select();
      document.execCommand('copy');
      alert("Email berhasil di-copy!");
    }
  </script>
</body>
</html>
