<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alight Motion Premium Tool</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1a1a1d;
            --text-main: #ffffff;
            --text-muted: #888888;
            --primary: #ffffff;
            --danger: #ff4a4a;
            --success: #2ed573;
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            background: #2a2a2a;
            border: 1px solid #444;
        }

        .status-online {
            color: var(--success);
            font-size: 12px;
        }

        p.desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group label span {
            color: var(--danger);
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            background-color: #0f0f11;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: black;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .response-area {
            margin-top: 15px;
            background-color: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
            color: var(--success);
            white-space: pre-wrap;
            word-wrap: break-word;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>AlwaysCodex API Web</h1>
            <p style="color: var(--text-muted);">Alight Motion Premium Integration</p>
        </div>

        <div class="card">
            <h2>
                <span class="badge">GET</span> /api/am/sendv2 
                <span style="margin-left:auto" class="status-online">● ONLINE</span>
            </h2>
            <p class="desc">Kirim email sign-in link Alight Motion via Firebase Auth</p>
            
            <form id="formSend">
                <div class="form-group">
                    <label>Email <span>*</span></label>
                    <input type="email" id="sendEmail" placeholder="user@email.com" required>
                </div>
                <button type="submit" id="btnSend">▶ Try (Send Email)</button>
            </form>
            <div id="resSend" class="response-area"></div>
        </div>

        <div class="card">
            <h2>
                <span class="badge">GET</span> /api/am/verifv2 
                <span style="margin-left:auto" class="status-online">● ONLINE</span>
            </h2>
            <p class="desc">Verifikasi email link & apply premium Alight Motion</p>
            
            <form id="formVerif">
                <div class="form-group">
                    <label>Email <span>*</span></label>
                    <input type="email" id="verifEmail" placeholder="user@email.com" required>
                </div>
                <div class="form-group">
                    <label>Link <span>*</span></label>
                    <input type="text" id="verifLink" placeholder="https://alightcreative.com/auth_action..." required>
                </div>
                <button type="submit" id="btnVerif">▶ Try (Verify Link)</button>
            </form>
            <div id="resVerif" class="response-area"></div>
        </div>
    </div>

    <script>
        const API_BASE = "https://api.alwayscodex.eu.cc";

        // Fungsi Helper untuk menampilkan hasil
        function showResponse(elementId, data, isError = false) {
            const el = document.getElementById(elementId);
            el.style.display = "block";
            el.style.color = isError ? "var(--danger)" : "var(--success)";
            el.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
        }

        // Handle Form 1: Send Email (/api/am/sendv2)
        document.getElementById('formSend').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('sendEmail').value;
            const btn = document.getElementById('btnSend');
            const resArea = 'resSend';

            btn.disabled = true;
            btn.textContent = "Loading...";

            try {
                // Menggunakan metode GET dengan query parameter seperti di gambar
                const response = await fetch(`${API_BASE}/api/am/sendv2?email=${encodeURIComponent(email)}`);
                const result = await response.json().catch(() => ({ status: response.status, message: "Response bukan JSON valid" }));
                
                showResponse(resArea, result, !response.ok);
            } catch (error) {
                showResponse(resArea, "Error: " + error.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = "▶ Try (Send Email)";
            }
        });

        // Handle Form 2: Verify Link (/api/am/verifv2)
        document.getElementById('formVerif').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('verifEmail').value;
            const link = document.getElementById('verifLink').value;
            const btn = document.getElementById('btnVerif');
            const resArea = 'resVerif';

            btn.disabled = true;
            btn.textContent = "Loading...";

            try {
                // Menggunakan metode GET dengan multiple query parameters
                const response = await fetch(`${API_BASE}/api/am/verifv2?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`);
                const result = await response.json().catch(() => ({ status: response.status, message: "Response bukan JSON valid" }));
                
                showResponse(resArea, result, !response.ok);
            } catch (error) {
                showResponse(resArea, "Error: " + error.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = "▶ Try (Verify Link)";
            }
        });
    </script>
</body>
</html>
