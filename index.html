<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM.PREMIUM // ACTIVATOR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap');

        :root {
            --bg: #0a0a0a;
            --text-main: #ffffff;
            --text-dim: #666666;
            --border: #333333;
            --accent: #ffffff;
            --error: #ff4a4a;
            --success: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            /* Tambahan: Grid tipis ala blueprint/terminal */
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 8vh 24px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        /* Container background biar text tetep kebaca di atas grid */
        .content-wrapper {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(4px);
            padding: 2rem;
            border-radius: 4px;
            border: 1px solid rgba(51, 51, 51, 0.5);
        }

        header {
            margin-bottom: 3rem;
            animation: fadeDown 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .step {
            margin-bottom: 3rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step.disabled {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        .step-num {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border: 1px solid var(--text-main);
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .step-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            padding: 12px 0;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-bottom-color: var(--accent);
        }

        label {
            position: absolute;
            left: 0;
            top: 12px;
            color: var(--text-dim);
            font-size: 1rem;
            pointer-events: none;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1) all;
        }

        input:focus ~ label,
        input:valid ~ label,
        input:not(:placeholder-shown) ~ label {
            top: -12px;
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        button {
            width: 100%;
            background-color: var(--text-main);
            color: var(--bg);
            border: 1px solid var(--text-main);
            padding: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background-color: transparent;
            color: var(--text-main);
        }

        button:disabled {
            background-color: transparent;
            color: var(--text-dim);
            border-color: var(--border);
            cursor: not-allowed;
        }

        /* Tambahan: Animasi loading pada button */
        button.loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; border-color: var(--border); }
            50% { opacity: 0.5; border-color: var(--text-dim); }
            100% { opacity: 1; border-color: var(--border); }
        }

        .status-msg {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            font-family: 'Space Grotesk', monospace;
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            min-height: 20px;
        }

        .status-msg.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .msg-error { color: var(--error); }
        .msg-success { color: var(--success); }

        /* Tambahan: Blinking cursor untuk efek ngetik */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: currentColor;
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Tambahan: Minimalist Footer */
        footer {
            margin-top: 4rem;
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px dashed var(--border);
            padding-top: 2rem;
            letter-spacing: 0.05em;
        }
        
        footer span {
            color: var(--text-main);
            font-weight: 600;
        }

        @keyframes fadeDown {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content-wrapper">
            <header>
                <h1>AM.PREMIUM</h1>
                <p class="subtitle">Developed by Adam // 1.0 </p>
            </header>

            <div class="step" id="step1">
                <div class="step-header">
                    <span class="step-num">1</span>
                    <h2 class="step-title">Authentication Link</h2>
                </div>
                
                <form id="formSend">
                    <div class="input-group">
                        <input type="email" id="sendEmail" placeholder=" " required autocomplete="off">
                        <label>Alamat Email</label>
                    </div>
                    <button type="submit" id="btnSend">Request Link</button>
                    <div id="resSend" class="status-msg"></div>
                </form>
            </div>

            <div class="step disabled" id="step2">
                <div class="step-header">
                    <span class="step-num">2</span>
                    <h2 class="step-title">Verify & Inject</h2>
                </div>
                
                <form id="formVerif">
                    <div class="input-group">
                        <input type="email" id="verifEmail" placeholder=" " required readonly style="color: var(--text-dim); border-bottom-style: dashed;">
                        <label>Email Terdaftar</label>
                    </div>
                    <div class="input-group">
                        <input type="text" id="verifLink" placeholder=" " required autocomplete="off">
                        <label>Paste Verification Link</label>
                    </div>
                    <button type="submit" id="btnVerif">Inject Premium</button>
                    <div id="resVerif" class="status-msg"></div>
                </form>
            </div>

            <footer>
                <p>SECURE INJECTION SYSTEM &copy; 2026</p>
                <p>ACCESS LEVEL: <span>ROOT</span> // DEV: <span>ADAM</span></p>
            </footer>
        </div>
    </div>

    <script>
        // Fungsi tambahan: Efek Ngetik (Typewriter)
        function typeWriterEffect(elementId, text, isError) {
            const el = document.getElementById(elementId);
            el.className = `status-msg show ${isError ? 'msg-error' : 'msg-success'}`;
            el.innerHTML = ''; // Kosongkan dulu
            
            const prefix = isError ? '[ERROR] ' : '[OK] ';
            const fullText = prefix + text;
            let i = 0;

            function type() {
                if (i < fullText.length) {
                    el.innerHTML = fullText.substring(0, i + 1) + '<span class="cursor"></span>';
                    i++;
                    setTimeout(type, 30); // Kecepatan ngetik
                } else {
                    // Berhenti ngetik, biarkan cursor kedip bentar trus ilangin
                    el.innerHTML = fullText + '<span class="cursor" style="animation: none; opacity: 0;"></span>';
                }
            }
            type();
        }

        // Handle Langkah 1
        document.getElementById('formSend').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('sendEmail').value;
            const btn = document.getElementById('btnSend');
            const resArea = 'resSend';

            btn.disabled = true;
            btn.textContent = "PROCESSING...";
            btn.classList.add('loading'); // Tambah animasi kedip
            document.getElementById(resArea).classList.remove('show');

            try {
                const targetUrl = `/api/am/sendv2?email=${encodeURIComponent(email)}`;
                const response = await fetch(targetUrl);
                const result = await response.json();
                
                if (!response.ok) throw new Error(result.message || "Gagal menghubungi server.");
                
                typeWriterEffect(resArea, "Link dikirim. Silakan cek inbox email kamu.", false);
                btn.textContent = "REQUEST SENT";
                
                setTimeout(() => {
                    const step2 = document.getElementById('step2');
                    step2.classList.remove('disabled');
                    document.getElementById('verifEmail').value = email;
                    document.getElementById('verifLink').focus();
                    step2.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 1200); // Delay dikit biar efek ngetik kelar dulu

            } catch (error) {
                typeWriterEffect(resArea, error.message, true);
                btn.disabled = false;
                btn.textContent = "REQUEST LINK";
            } finally {
                btn.classList.remove('loading');
            }
        });

        // Handle Langkah 2
        document.getElementById('formVerif').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('verifEmail').value;
            const link = document.getElementById('verifLink').value;
            const btn = document.getElementById('btnVerif');
            const resArea = 'resVerif';

            btn.disabled = true;
            btn.textContent = "INJECTING...";
            btn.classList.add('loading');
            document.getElementById(resArea).classList.remove('show');

            try {
                const targetUrl = `/api/am/verifv2?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`;
                const response = await fetch(targetUrl);
                const result = await response.json();

                if (!response.ok) throw new Error(result.message || "Verifikasi gagal.");
                
                typeWriterEffect(resArea, "Aktivasi sukses. Akun Premium siap digunakan.", false);
                btn.textContent = "SUCCESS";
                btn.style.backgroundColor = "#fff";
                btn.style.color = "#000";
            } catch (error) {
                typeWriterEffect(resArea, error.message, true);
                btn.disabled = false;
                btn.textContent = "INJECT PREMIUM";
            } finally {
                btn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
