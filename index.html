<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adam.dev - 1-Click AM Activator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #c0c0c0;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #d4d0c8;
      border: 2px solid #ffffff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      padding: 12px;
      box-shadow: 2px 2px 0px #000000;
    }

    .header-bar {
      background-color: #000080;
      color: #ffffff;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-bar span.brand {
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
    }

    fieldset {
      border: 2px solid #ffffff;
      border-left-color: #808080;
      border-top-color: #808080;
      background-color: #ece9d8;
      margin-bottom: 12px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 11px;
      background-color: #d4d0c8;
      border: 1px solid #808080;
      padding: 2px 6px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 6px;
      border: 2px inset #ffffff;
      background-color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      outline: none;
    }

    .btn-main {
      width: 100%;
      padding: 10px;
      background-color: #008000;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-secondary {
      width: 100%;
      padding: 6px;
      background-color: #d4d0c8;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-action {
      width: 100%;
      padding: 8px;
      background-color: #000080;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    button:active {
      border: 2px inset #ffffff;
    }

    button:disabled {
      background-color: #808080 !important;
      color: #c0c0c0 !important;
      cursor: not-allowed;
    }

    .output-box {
      width: 100%;
      height: 120px;
      margin-top: 4px;
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #808080;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .inbox-box {
      width: 100%;
      height: 70px;
      margin-top: 4px;
      background-color: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #ffffff;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #333333;
      margin-top: 6px;
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <span>[ AM AUTO ACTIVATOR ]</span>
      <span class="brand">adam.dev</span>
    </div>

    <!-- OTOMATISASI 1-KLIK -->
    <fieldset>
      <legend>Otomatisasi 1-Klik</legend>
      <button id="btnStart" class="btn-main" onclick="startFullAutomation()">[ 🚀 BUAT & AKTIFKAN AKUN ]</button>
    </fieldset>

    <!-- DETAIL AKUN -->
    <fieldset>
      <legend>Detail Akun Terbuat</legend>
      <div class="form-group">
        <label for="activeEmail">EMAIL AKUN AM PREMIUM:</label>
        <input type="email" id="activeEmail" placeholder="Belum ada akun terbuat..." readonly>
      </div>
      <button id="btnCopy" class="btn-secondary" onclick="copyEmail()" disabled>[ 📋 COPY EMAIL ]</button>
    </fieldset>

    <!-- INBOX & MANUAL LINK -->
    <fieldset>
      <legend>Akses Inbox & Paste Link Manual</legend>
      <button id="btnCheckInbox" class="btn-secondary" onclick="checkInboxManual()" disabled>[ 📥 CEK PESAN MASUK ]</button>
      <button id="btnProcessInbox" class="btn-action" onclick="processExistingInbox()" disabled>[ ⚡ PROSES DARI INBOX ]</button>
      <textarea id="inboxView" class="inbox-box" readonly>[ Klik 'CEK PESAN MASUK' untuk membaca email... ]</textarea>

      <div class="form-group" style="margin-top: 8px;">
        <label for="manualLink">LINK VERIFIKASI TERDETEKSI:</label>
        <input type="text" id="manualLink" placeholder="Tautan dari tombol 'Sign in to Alight Creative'...">
      </div>
      <button id="btnManualVerif" class="btn-secondary" onclick="executeManualLink()">[ 🔑 AKTIFKAN LINK TERSEBUT ]</button>
    </fieldset>

    <!-- CONSOLE LOG -->
    <fieldset>
      <legend>Console Log</legend>
      <textarea id="consoleLog" class="output-box" readonly>[ Ready. Klik 'BUAT & AKTIFKAN AKUN' untuk mulai. ]</textarea>
    </fieldset>

    <div class="footer">
      System Automated &bull; adam.dev
    </div>
  </div>

  <script>
    const PROXY_BASE = window.location.hostname.includes('vercel.app') 
      ? '/backend-api' 
      : 'https://api.alwayscodex.eu.cc';

    function log(msg) {
      const consoleBox = document.getElementById('consoleLog');
      consoleBox.value += `\n> ${msg}`;
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 10000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    // PARSER KHUSUS HTML HREF (MEMBACA LINK DARI TOMBOL SIGN IN ALIGHT CREATIVE)
    function extractLinkFromHtml(dataInbox) {
      if (!dataInbox) return null;

      let str = typeof dataInbox === 'string' ? dataInbox : JSON.stringify(dataInbox);

      // Clean HTML entities & escape chars
      str = str.replace(/\\\/g, '/')
               .replace(/\\n/gi, ' ')
               .replace(/\\r/gi, ' ')
               .replace(/\\"/g, '"')
               .replace(/=3D/gi, '=')
               .replace(/=\r?\n/g, '')
               .replace(/&amp;/g, '&')
               .replace(/&quot;/g, '"')
               .replace(/&lt;/g, '<')
               .replace(/&gt;/g, '>');

      // Extract href attributes (e.g. href="https://alightcreative.com/...")
      const hrefRegex = /href=["']?(https?:\/\/[^"'\s>]+)["']?/gi;
      let matches = [];
      let match;

      while ((match = hrefRegex.exec(str)) !== null) {
        matches.push(match[1]);
      }

      // Append standard URLs as fallback
      const standardUrls = str.match(/https?:\/\/[^\s"'<>\\\]\[\}(\)]+/gi) || [];
      matches = [...matches, ...standardUrls];

      // Filter and prioritize
      const cleanUrls = matches.map(u => u.replace(/["';,>)]+$/, '')).filter(u => u.startsWith('http'));

      for (let url of cleanUrls) {
        let lower = url.toLowerCase();
        if ((lower.includes('alight') || lower.includes('firebase') || lower.includes('oobcode') || lower.includes('auth')) &&
            !lower.includes('alwayscodex') && !lower.includes('1timetech') && !lower.includes('vercel')) {
          return url;
        }
      }

      for (let url of cleanUrls) {
        let lower = url.toLowerCase();
        if ((lower.includes('oobcode') || lower.includes('mode=') || lower.includes('signin')) &&
            !lower.includes('alwayscodex') && !lower.includes('1timetech')) {
          return url;
        }
      }

      return null;
    }

    // PROSES AUTOMATION
    async function startFullAutomation() {
      const btn = document.getElementById('btnStart');
      const emailInput = document.getElementById('activeEmail');
      const consoleBox = document.getElementById('consoleLog');

      btn.disabled = true;
      btn.innerText = "[ ⏳ MEMPROSES... ]";
      consoleBox.value = "[ MEMULAI AUTOMATION... ]";
      emailInput.value = "";

      try {
        // 1. Create Email
        log("[1/4] Membuat email temporary...");
        const res1 = await fetchWithTimeout(`${PROXY_BASE}/api/tempmail/1timetech?action=create`);
        const data1 = await res1.json();

        let createdEmail = data1.result ? data1.result.email : null;
        if (!createdEmail && data1.email) createdEmail = data1.email;

        if (!createdEmail) throw new Error("Gagal mengambil email dari response API.");

        emailInput.value = createdEmail;
        document.getElementById('btnCopy').disabled = false;
        document.getElementById('btnCheckInbox').disabled = false;
        document.getElementById('btnProcessInbox').disabled = false;

        log(`[1/4] Email berhasil dibuat: ${createdEmail}`);

        // 2. Send Request
        log("[2/4] Mengirim request verifikasi Alight Motion...");
        await fetchWithTimeout(`${PROXY_BASE}/api/am/sendv2?email=${encodeURIComponent(createdEmail)}`);
        log("[2/4] Link verifikasi terkirim.");

        // 3. Poll Inbox
        log("[3/4] Auto-check inbox (10x pengecekan)...");
        let foundLink = null;
        let attempts = 0;

        while (attempts < 10 && !foundLink) {
          attempts++;
          await new Promise(r => setTimeout(r, 3000));

          try {
            const resInbox = await fetchWithTimeout(`${PROXY_BASE}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(createdEmail)}`);
            const dataInbox = await resInbox.json();

            document.getElementById('inboxView').value = JSON.stringify(dataInbox, null, 2);

            foundLink = extractLinkFromHtml(dataInbox);

            if (foundLink) {
              log(`[3/4] Link HTML berhasil diekstrak dari tombol Sign In!`);
              document.getElementById('manualLink').value = foundLink;
            } else {
              log(`[3/4] Check ke-${attempts}/10... membaca email.`);
            }
          } catch (e) {
            log(`[3/4] Check ke-${attempts}... mengulang.`);
          }
        }

        if (!foundLink) {
          log("⚠️ Jika auto-check selesai, klik tombol '[ ⚡ PROSES DARI INBOX ]'.");
          return;
        }

        // 4. Activate
        await executeActivation(createdEmail, foundLink);

      } catch (err) {
        log(`❌ ERROR: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerText = "[ 🚀 BUAT & AKTIFKAN AKUN ]";
      }
    }

    async function processExistingInbox() {
      const email = document.getElementById('activeEmail').value.trim();
      const btn = document.getElementById('btnProcessInbox');

      if (!email) return alert("Belum ada email!");

      btn.disabled = true;
      log("Mengekstrak link dari tag href HTML inbox...");

      try {
        const res = await fetchWithTimeout(`${PROXY_BASE}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(email)}`);
        const dataInbox = await res.json();

        document.getElementById('inboxView').value = JSON.stringify(dataInbox, null, 2);

        const foundLink = extractLinkFromHtml(dataInbox);

        if (!foundLink) {
          throw new Error("Link HTML belum terdeteksi. Silakan coba lagi.");
        }

        log("Link verifikasi berhasil ditemukan di tombol HTML!");
        document.getElementById('manualLink').value = foundLink;
        await executeActivation(email, foundLink);

      } catch (err) {
        log(`❌ ERROR: ${err.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    async function executeManualLink() {
      const email = document.getElementById('activeEmail').value.trim();
      const link = document.getElementById('manualLink').value.trim();

      if (!email || !link) return alert("Email dan Link wajib terisi!");

      log("Memproses aktivasi via link manual...");
      await executeActivation(email, link);
    }

    async function executeActivation(email, link) {
      log("[4/4] Memproses aktivasi Premium...");
      const verifUrl = `${PROXY_BASE}/api/am/verifv2?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`;
      
      try {
        await fetchWithTimeout(verifUrl);
      } catch(e) {
        await fetch(verifUrl, { mode: 'no-cors' });
      }

      log("==========================================");
      log("🎉 SUKSES! Akun Premium Berhasil Aktif!");
      log("==========================================");
    }

    async function checkInboxManual() {
      const email = document.getElementById('activeEmail').value.trim();
      const inboxView = document.getElementById('inboxView');

      if (!email) return alert("Belum ada email!");

      inboxView.value = "Memuat inbox...";
      try {
        const res = await fetchWithTimeout(`${PROXY_BASE}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(email)}`);
        const data = await res.json();
        inboxView.value = JSON.stringify(data, null, 2);

        const link = extractLinkFromHtml(data);
        if (link) {
          document.getElementById('manualLink').value = link;
        }
      } catch (err) {
        inboxView.value = "Gagal memuat pesan inbox.";
      }
    }

    function copyEmail() {
      const emailInput = document.getElementById('activeEmail');
      navigator.clipboard.writeText(emailInput.value);
      alert("Email berhasil di-copy!");
    }
  </script>
</body>
</html>
