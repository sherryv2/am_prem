<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Aktivasi Alight Motion Premium - AlwaysCodex API</title>
  <style>
    body {
      background-color: #c0c0c0;
      font-family: "Times New Roman", Times, serif;
      color: #000000;
      margin: 20px;
    }

    .main-box {
      width: 550px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 2px inset #ffffff;
      padding: 15px;
      box-shadow: 3px 3px 0px #000000;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-top: 0;
      text-transform: uppercase;
      border-bottom: 2px groove #808080;
      padding-bottom: 5px;
    }

    fieldset {
      border: 2px groove #ffffff;
      background-color: #ececec;
      margin-bottom: 15px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 14px;
      background-color: #000080;
      color: #ffffff;
      padding: 2px 6px;
    }

    table {
      width: 100%;
    }

    td {
      font-size: 13px;
      padding: 3px 0;
    }

    input[type="text"], input[type="email"] {
      width: 96%;
      padding: 3px;
      border: 2px inset #ffffff;
      background-color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
    }

    button {
      margin-top: 5px;
      padding: 3px 12px;
      background-color: #c0c0c0;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      border: 2px inset #ffffff;
    }

    textarea {
      width: 96%;
      height: 60px;
      margin-top: 5px;
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #808080;
      resize: none;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #555555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="main-box">
    <h1>[ AlwaysCodex AM Tool ]</h1>

    <!-- LANGKAH 1 -->
    <fieldset>
      <legend>Langkah 1: Kirim Link Verifikasi</legend>
      <table>
        <tr>
          <td width="30%"><strong>Email Alight:</strong></td>
          <td><input type="email" id="email1" placeholder="user@gmail.com" onkeyup="syncEmail()"></td>
        </tr>
        <tr>
          <td></td>
          <td><button onclick="sendVerificationLink()">[ Kirim Email ]</button></td>
        </tr>
        <tr>
          <td colspan="2">
            <small>Status Output:</small><br>
            <textarea id="output1" readonly>[Menunggu Perintah...]</textarea>
          </td>
        </tr>
      </table>
    </fieldset>

    <!-- LANGKAH 2 -->
    <fieldset>
      <legend>Langkah 2: Verifikasi & Apply Premium</legend>
      <table>
        <tr>
          <td width="30%"><strong>Email Alight:</strong></td>
          <td><input type="email" id="email2" placeholder="user@gmail.com"></td>
        </tr>
        <tr>
          <td><strong>Link Verifikasi:</strong></td>
          <td><input type="text" id="link2" placeholder="https://alightcreative.com/auth_..."></td>
        </tr>
        <tr>
          <td></td>
          <td><button onclick="verifyAndApply()">[ Aktifkan Premium ]</button></td>
        </tr>
        <tr>
          <td colspan="2">
            <small>Status Output:</small><br>
            <textarea id="output2" readonly>[Menunggu Perintah...]</textarea>
          </td>
        </tr>
      </table>
    </fieldset>

    <div class="footer">
      Powered by AlwaysCodex API &bull; Web Interface v1.0
    </div>
  </div>

  <script>
    const API_HOST = 'https://api.alwayscodex.eu.cc';

    // Otomatis samakan email di langkah 1 ke langkah 2
    function syncEmail() {
      document.getElementById('email2').value = document.getElementById('email1').value;
    }

    // Fungsi Request API 1 (/api/am/sendv2)
    async function sendVerificationLink() {
      const email = document.getElementById('email1').value.trim();
      const out = document.getElementById('output1');

      if (!email) {
        alert("Harap masukkan email terlebih dahulu!");
        return;
      }

      out.value = "CONNECTING TO SERVER...\nMohon tunggu...";

      try {
        const url = `${API_HOST}/api/am/sendv2?email=${encodeURIComponent(email)}`;
        const res = await fetch(url);
        const text = await res.text();

        out.value = `HTTP STATUS: ${res.status}\nRESPONSE:\n${text}`;
      } catch (err) {
        out.value = `ERROR / FAILED TO FETCH:\n${err.message}\n\n*Catatan: Jika timbul error CORS saat dibuka lokal (file://), gunakan extension 'Allow CORS' di browser atau jalankan via web server.`;
      }
    }

    // Fungsi Request API 2 (/api/am/verifv2)
    async function verifyAndApply() {
      const email = document.getElementById('email2').value.trim();
      const link = document.getElementById('link2').value.trim();
      const out = document.getElementById('output2');

      if (!email || !link) {
        alert("Email dan Link verifikasi wajib diisi!");
        return;
      }

      out.value = "CONNECTING TO SERVER...\nMemproses aktivasi...";

      try {
        const url = `${API_HOST}/api/am/verifv2?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`;
        const res = await fetch(url);
        const text = await res.text();

        out.value = `HTTP STATUS: ${res.status}\nRESPONSE:\n${text}`;
      } catch (err) {
        out.value = `ERROR / FAILED TO FETCH:\n${err.message}\n\n*Catatan: Jika timbul error CORS saat dibuka lokal (file://), gunakan extension 'Allow CORS' di browser atau jalankan via web server.`;
      }
    }
  </script>

</body>
</html>
