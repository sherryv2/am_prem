<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM.PREMIUM // ACTIVATOR</title>
    <style>
        /* Menggunakan font typography yang kuat dan clean */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap');

        :root {
            --bg: #0a0a0a;
            --text-main: #ffffff;
            --text-dim: #666666;
            --border: #333333;
            --accent: #ffffff;
            --error: #ff4a4a;
            --success: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10vh 24px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Teks Typographic Header */
        header {
            margin-bottom: 3rem;
            animation: fadeDown 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Step Section */
        .step {
            margin-bottom: 3rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step.disabled {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        .step-num {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border: 1px solid var(--text-main);
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .step-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* Floating Label Input Interaktif */
        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            padding: 12px 0;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-bottom-color: var(--accent);
        }

        label {
            position: absolute;
            left: 0;
            top: 12px;
            color: var(--text-dim);
            font-size: 1rem;
            pointer-events: none;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1) all;
        }

        /* Ketika input fokus atau sudah diisi, label naik ke atas */
        input:focus ~ label,
        input:valid ~ label,
        input:not(:placeholder-shown) ~ label {
            top: -12px;
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Button Clean & Brutalist */
        button {
            width: 100%;
            background-color: var(--text-main);
            color: var(--bg);
            border: 1px solid var(--text-main);
            padding: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: transparent;
            color: var(--text-main);
        }

        button:disabled {
            background-color: transparent;
            color: var(--text-dim);
            border-color: var(--border);
            cursor: not-allowed;
        }

        /* Feedback Status */
        .status-msg {
            margin-top: 1rem;
            font-size: 0.85rem;
            font-family: 'Space Grotesk', sans-serif;
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .status-msg.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .msg-error { color: var(--error); }
        .msg-success { color: var(--success); }

        @keyframes fadeDown {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>AM.PREMIUM</h1>
            <p class="subtitle">System Activator // v2.0</p>
        </header>

        <!-- Langkah 1 -->
        <div class="step" id="step1">
            <div class="step-header">
                <span class="step-num">1</span>
                <h2 class="step-title">Authentication Link</h2>
            </div>
            
            <form id="formSend">
                <div class="input-group">
                    <!-- placeholder=" " diperlukan agar pseudo-class :placeholder-shown berfungsi untuk logika label -->
                    <input type="email" id="sendEmail" placeholder=" " required autocomplete="off">
                    <label>Alamat Email</label>
                </div>
                <button type="submit" id="btnSend">Request Link</button>
                <div id="resSend" class="status-msg"></div>
            </form>
        </div>

        <!-- Langkah 2 (Awalnya dibuat pudar/disabled) -->
        <div class="step disabled" id="step2">
            <div class="step-header">
                <span class="step-num">2</span>
                <h2 class="step-title">Verify & Inject</h2>
            </div>
            
            <form id="formVerif">
                <div class="input-group">
                    <input type="email" id="verifEmail" placeholder=" " required readonly style="color: var(--text-dim); border-bottom-style: dashed;">
                    <label>Email Terdaftar</label>
                </div>
                <div class="input-group">
                    <input type="text" id="verifLink" placeholder=" " required autocomplete="off">
                    <label>Paste Verification Link</label>
                </div>
                <button type="submit" id="btnVerif">Inject Premium</button>
                <div id="resVerif" class="status-msg"></div>
            </form>
        </div>
    </div>

    <script>
        function showStatus(elementId, text, isError = false) {
            const el = document.getElementById(elementId);
            el.className = `status-msg show ${isError ? 'msg-error' : 'msg-success'}`;
            // Format log ala terminal
            el.innerHTML = isError ? `[ERROR] ${text}` : `[OK] ${text}`;
        }

        // Handle Langkah 1
        document.getElementById('formSend').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('sendEmail').value;
            const btn = document.getElementById('btnSend');
            const resArea = 'resSend';

            btn.disabled = true;
            btn.textContent = "PROCESSING...";
            document.getElementById(resArea).classList.remove('show');

            try {
                // Fetch Vercel API path
                const targetUrl = `/api/am/sendv2?email=${encodeURIComponent(email)}`;
                const response = await fetch(targetUrl);
                const result = await response.json();
                
                if (!response.ok) throw new Error(result.message || "Gagal menghubungi server.");
                
                showStatus(resArea, "Link dikirim. Silakan cek inbox email kamu.");
                btn.textContent = "REQUEST SENT";
                
                // Interaksi: Buka gembok langkah 2
                setTimeout(() => {
                    const step2 = document.getElementById('step2');
                    step2.classList.remove('disabled');
                    document.getElementById('verifEmail').value = email;
                    document.getElementById('verifLink').focus();
                    
                    // Scroll halus ke langkah 2
                    step2.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 800);

            } catch (error) {
                showStatus(resArea, error.message, true);
                btn.disabled = false;
                btn.textContent = "REQUEST LINK";
            }
        });

        // Handle Langkah 2
        document.getElementById('formVerif').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('verifEmail').value;
            const link = document.getElementById('verifLink').value;
            const btn = document.getElementById('btnVerif');
            const resArea = 'resVerif';

            btn.disabled = true;
            btn.textContent = "INJECTING...";
            document.getElementById(resArea).classList.remove('show');

            try {
                const targetUrl = `/api/am/verifv2?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`;
                const response = await fetch(targetUrl);
                const result = await response.json();

                if (!response.ok) throw new Error(result.message || "Verifikasi gagal.");
                
                showStatus(resArea, "Aktivasi sukses. Akun Premium siap digunakan.");
                btn.textContent = "SUCCESS";
                btn.style.backgroundColor = "#fff";
                btn.style.color = "#000";
            } catch (error) {
                showStatus(resArea, error.message, true);
                btn.disabled = false;
                btn.textContent = "INJECT PREMIUM";
            }
        });
    </script>
</body>
</html>
