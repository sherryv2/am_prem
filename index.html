<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adam.dev - 1-Click AM Activator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #c0c0c0;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #d4d0c8;
      border: 2px solid #ffffff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      padding: 12px;
      box-shadow: 2px 2px 0px #000000;
    }

    .header-bar {
      background-color: #000080;
      color: #ffffff;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-bar span.brand {
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
    }

    fieldset {
      border: 2px solid #ffffff;
      border-left-color: #808080;
      border-top-color: #808080;
      background-color: #ece9d8;
      margin-bottom: 12px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 11px;
      background-color: #d4d0c8;
      border: 1px solid #808080;
      padding: 2px 6px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 6px;
      border: 2px inset #ffffff;
      background-color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      outline: none;
    }

    .btn-main {
      width: 100%;
      padding: 10px;
      background-color: #008000;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-secondary {
      width: 100%;
      padding: 6px;
      background-color: #d4d0c8;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-action {
      width: 100%;
      padding: 8px;
      background-color: #000080;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    button:active {
      border: 2px inset #ffffff;
    }

    button:disabled {
      background-color: #808080 !important;
      color: #c0c0c0 !important;
      cursor: not-allowed;
    }

    .output-box {
      width: 100%;
      height: 120px;
      margin-top: 4px;
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #808080;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .inbox-box {
      width: 100%;
      height: 70px;
      margin-top: 4px;
      background-color: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #ffffff;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #333333;
      margin-top: 6px;
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <span>[ AM AUTO ACTIVATOR ]</span>
      <span class="brand">adam.dev</span>
    </div>

    <!-- OTOMATISASI 1-KLIK -->
    <fieldset>
      <legend>Otomatisasi 1-Klik</legend>
      <button id="btnStart" class="btn-main" onclick="startFullAutomation()">[ 🚀 BUAT & AKTIFKAN AKUN ]</button>
    </fieldset>

    <!-- DETAIL AKUN -->
    <fieldset>
      <legend>Detail Akun Terbuat</legend>
      <div class="form-group">
        <label for="activeEmail">EMAIL AKUN AM PREMIUM:</label>
        <input type="email" id="activeEmail" placeholder="Belum ada akun terbuat..." readonly>
      </div>
      <button id="btnCopy" class="btn-secondary" onclick="copyEmail()" disabled>[ 📋 COPY EMAIL ]</button>
    </fieldset>

    <!-- INBOX VIEW -->
    <fieldset>
      <legend>Akses Inbox & Ekstraksi Manual</legend>
      <button id="btnCheckInbox" class="btn-secondary" onclick="checkInboxManual()" disabled>[ 📥 CEK PESAN MASUK ]</button>
      <button id="btnProcessInbox" class="btn-action" onclick="processExistingInbox()" disabled>[ ⚡ PROSES AKTIVASI DARI INBOX ]</button>
      <textarea id="inboxView" class="inbox-box" readonly>[ Klik 'CEK PESAN MASUK' untuk membaca email... ]</textarea>
    </fieldset>

    <!-- CONSOLE LOG -->
    <fieldset>
      <legend>Console Log</legend>
      <textarea id="consoleLog" class="output-box" readonly>[ Ready. Klik 'BUAT & AKTIFKAN AKUN' untuk mulai. ]</textarea>
    </fieldset>

    <div class="footer">
      System Automated &bull; adam.dev
    </div>
  </div>

  <script>
    const PROXY_BASE = window.location.hostname.includes('vercel.app') 
      ? '/backend-api' 
      : 'https://api.alwayscodex.eu.cc';

    function log(msg) {
      const consoleBox = document.getElementById('consoleLog');
      consoleBox.value += `\n> ${msg}`;
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    // Helper fetch dengan timeout otomatis (8 detik) agar tidak pernah macet
    async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    // Pembersih & Pengambil Link Verifikasi
    function extractBestVerificationLink(dataInbox) {
      if (!dataInbox) return null;
      let rawStr = typeof dataInbox === 'string' ? dataInbox : JSON.stringify(dataInbox);

      rawStr = rawStr.replace(/=\r?\n/g, '')
                     .replace(/=3D/gi, '=')
                     .replace(/\\\\/g, '/')
                     .replace(/\\n/gi, ' ')
                     .replace(/\\r/gi, ' ')
                     .replace(/\\"/g, '"');

      const matches = rawStr.match(/https?:\/\/[^\s"'<>\\\]\[\}(\)]+/gi);
      if (!matches || matches.length === 0) return null;

      const cleanUrls = matches.map(u => {
        let clean = u.replace(/["';,>)]+$/, '');
        try { clean = decodeURIComponent(clean); } catch(e){}
        return clean;
      });

      for (let u of cleanUrls) {
        let lower = u.toLowerCase();
        if ((lower.includes('alight') || lower.includes('firebase') || lower.includes('oobcode') || lower.includes('auth')) && 
            !lower.includes('alwayscodex') && !lower.includes('1timetech') && !lower.includes('vercel')) {
          return u;
        }
      }
      return null;
    }

    // PROSES OTOMATIS UTAMA
    async function startFullAutomation() {
      const btn = document.getElementById('btnStart');
      const emailInput = document.getElementById('activeEmail');
      const consoleBox = document.getElementById('consoleLog');

      btn.disabled = true;
      btn.innerText = "[ ⏳ SEDANG MEMPROSES... ]";
      consoleBox.value = "[ MEMULAI PROSES... ]";
      emailInput.value = "";

      try {
        // 1. Create Temp Email
        log("[1/4] Membuat temp email...");
        const res1 = await fetchWithTimeout(`${PROXY_BASE}/api/tempmail/1timetech?action=create`);
        const data1 = await res1.json();

        let createdEmail = data1.result ? data1.result.email : null;
        if (!createdEmail) throw new Error("Gagal mengambil email dari response API.");

        emailInput.value = createdEmail;
        document.getElementById('btnCopy').disabled = false;
        document.getElementById('btnCheckInbox').disabled = false;
        document.getElementById('btnProcessInbox').disabled = false;

        log(`[1/4] Email berhasil dibuat: ${createdEmail}`);

        // 2. Send Verification Link
        log("[2/4] Mengirim request verifikasi...");
        await fetchWithTimeout(`${PROXY_BASE}/api/am/sendv2?email=${encodeURIComponent(createdEmail)}`);
        log("[2/4] Request berhasil dikirim.");

        // 3. Auto-check Inbox (5x pengecekan = ~15 detik)
        log("[3/4] Menunggu email masuk (auto-check 5x)...");
        let foundLink = null;
        let attempts = 0;

        while (attempts < 5 && !foundLink) {
          attempts++;
          await new Promise(r => setTimeout(r, 3000));

          try {
            const resInbox = await fetchWithTimeout(`${PROXY_BASE}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(createdEmail)}`);
            const dataInbox = await resInbox.json();

            foundLink = extractBestVerificationLink(dataInbox);

            if (foundLink) {
              log(`[3/4] Link verifikasi berhasil ditemukan!`);
            } else {
              log(`[3/4] Check ke-${attempts}/5... belum ada link.`);
            }
          } catch (e) {
            log(`[3/4] Check ke-${attempts}... mengulang.`);
          }
        }

        if (!foundLink) {
          log("⚠️ Auto-check selesai. Jika email sudah muncul di kotak inbox bawah, klik '[ ⚡ PROSES DARI INBOX ]'.");
          return;
        }

        // 4. Activate
        await executeActivation(createdEmail, foundLink);

      } catch (err) {
        log(`❌ ERROR: ${err.message.includes('aborted') ? 'Koneksi timeout, silakan coba klik lagi.' : err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerText = "[ 🚀 BUAT & AKTIFKAN AKUN ]";
      }
    }

    // EKSEKUSI MANUAL DARI INBOX
    async function processExistingInbox() {
      const email = document.getElementById('activeEmail').value.trim();
      const btn = document.getElementById('btnProcessInbox');

      if (!email) return alert("Belum ada email!");

      btn.disabled = true;
      btn.innerText = "[ ⏳ MEMBACA INBOX... ]";
      log("Mengekstrak link dari inbox saat ini...");

      try {
        const res = await fetchWithTimeout(`${PROXY_BASE}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(email)}`);
        const dataInbox = await res.json();

        const foundLink = extractBestVerificationLink(dataInbox);

        if (!foundLink) {
          throw new Error("Link verifikasi belum ditemukan. Coba tekan 'CEK PESAN MASUK' terlebih dahulu.");
        }

        log("Link verifikasi berhasil ditemukan!");
        await executeActivation(email, foundLink);

      } catch (err) {
        log(`❌ ERROR: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerText = "[ ⚡ PROSES AKTIVASI DARI INBOX ]";
      }
    }

    // HELPER EKSEKUSI API VERIFIKASI
    async function executeActivation(email, link) {
      log("[4/4] Memproses aktivasi Premium...");
      const verifUrl = `${PROXY_BASE}/api/am/verifv2?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`;
      await fetchWithTimeout(verifUrl);

      log("==========================================");
      log("🎉 SUKSES! Akun Premium Berhasil Aktif!");
      log("==========================================");
    }

    async function checkInboxManual() {
      const email = document.getElementById('activeEmail').value.trim();
      const inboxView = document.getElementById('inboxView');

      if (!email) return alert("Belum ada email!");

      inboxView.value = "Memuat inbox...";
      try {
        const res = await fetchWithTimeout(`${PROXY_BASE}/api/tempmail/1timetech?action=inbox&email=${encodeURIComponent(email)}`);
        const data = await res.json();
        inboxView.value = JSON.stringify(data, null, 2);
      } catch (err) {
        inboxView.value = "Gagal memuat pesan inbox.";
      }
    }

    function copyEmail() {
      const emailInput = document.getElementById('activeEmail');
      navigator.clipboard.writeText(emailInput.value);
      alert("Email berhasil di-copy!");
    }
  </script>
</body>
</html>
