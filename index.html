<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AM.HOSTING // CUSTOM API</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap');
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #fff4e6;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .card {
      background: #fff;
      border: 3px solid #000;
      box-shadow: 6px 6px 0px #000;
      padding: 2rem;
      max-width: 450px;
      width: 100%;
    }

    h1 {
      background: #ffe600;
      border: 3px solid #000;
      display: inline-block;
      padding: 4px 8px;
      box-shadow: 3px 3px 0px #000;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    input[type="file"] {
      border: 3px solid #000;
      padding: 10px;
      width: 100%;
      margin-bottom: 1rem;
      box-sizing: border-box;
      background: #fff;
    }

    button {
      width: 100%;
      background: #00f0ff;
      border: 3px solid #000;
      padding: 12px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000;
      text-transform: uppercase;
    }

    button:hover {
      background: #ff6b8b;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
    }

    .result {
      margin-top: 1.5rem;
      padding: 12px;
      background: #00e676;
      border: 3px solid #000;
      box-shadow: 3px 3px 0px #000;
      display: none;
      word-break: break-all;
    }

    img {
      max-width: 100%;
      margin-top: 10px;
      border: 2px solid #000;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>IMAGE TO LINK</h1>
  <form id="uploadForm">
    <input type="file" id="imageInput" accept="image/*" required>
    <button type="submit" id="btnSubmit">GENERATE LINK</button>
  </form>

  <div id="resultBox" class="result">
    <p><strong>URL GAMBAR PUBLIC:</strong></p>
    <a id="imageUrl" href="" target="_blank" style="color: #000;"></a>
    <br><br>
    <img id="imagePreview" src="" alt="Preview">
  </div>
</div>

<script>
  const API_URL = "https://api.alwayscodex.eu.cc/api/tools/upload2";

  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('imageInput');
    const btn = document.getElementById('btnSubmit');
    const resultBox = document.getElementById('resultBox');

    const file = fileInput.files[0];
    if (!file) return;

    btn.disabled = true;
    btn.innerText = "UPLOADING TO API...";

    const formData = new FormData();
    // Menggunakan key 'file' atau 'image' sesuai standar API multipart
    formData.append('file', file);

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      // Mengecek respons URL dari API (menyesuaikan struktur json return)
      const resultUrl = data.url || data.result || data.link || (data.data && data.data.url);

      if (resultUrl) {
        document.getElementById('imageUrl').href = resultUrl;
        document.getElementById('imageUrl').innerText = resultUrl;
        document.getElementById('imagePreview').src = resultUrl;
        resultBox.style.display = 'block';
      } else {
        alert("Upload gagal atau format respons API tidak dikenali: " + JSON.stringify(data));
      }
    } catch (err) {
      alert("Error menghubungi API: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "GENERATE LINK";
    }
  });
</script>

</body>
</html>
