<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adam.dev - 1-Click AM Activator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #c0c0c0;
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #d4d0c8;
      border: 2px solid #ffffff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      padding: 12px;
      box-shadow: 2px 2px 0px #000000;
    }

    .header-bar {
      background-color: #000080;
      color: #ffffff;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-bar span.brand {
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
    }

    fieldset {
      border: 2px solid #ffffff;
      border-left-color: #808080;
      border-top-color: #808080;
      background-color: #ece9d8;
      margin-bottom: 12px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 11px;
      background-color: #d4d0c8;
      border: 1px solid #808080;
      padding: 2px 6px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 6px;
      border: 2px inset #ffffff;
      background-color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      outline: none;
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      background-color: #008000;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
      touch-action: manipulation;
    }

    .btn-secondary {
      width: 100%;
      padding: 6px;
      background-color: #d4d0c8;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
      touch-action: manipulation;
    }

    .btn-action {
      width: 100%;
      padding: 8px;
      background-color: #000080;
      color: #ffffff;
      border: 2px outset #ffffff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      touch-action: manipulation;
    }

    button:active {
      border: 2px inset #ffffff;
    }

    button:disabled {
      background-color: #808080 !important;
      color: #c0c0c0 !important;
      cursor: not-allowed;
    }

    .output-box {
      width: 100%;
      height: 120px;
      margin-top: 4px;
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #808080;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .inbox-box {
      width: 100%;
      height: 80px;
      margin-top: 4px;
      background-color: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      border: 2px inset #ffffff;
      padding: 6px;
      resize: none;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #333333;
      margin-top: 6px;
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <span>[ AM AUTO ACTIVATOR ]</span>
      <span class="brand">adam.dev</span>
    </div>

    <!-- OTOMATISASI 1-KLIK -->
    <fieldset>
      <legend>Otomatisasi 1-Klik</legend>
      <button type="button" id="btnStart" class="btn-main">[ 🚀 BUAT & AKTIFKAN AKUN ]</button>
    </fieldset>

    <!-- DETAIL AKUN -->
    <fieldset>
      <legend>Detail Akun Terbuat</legend>
      <div class="form-group">
        <label for="activeEmail">EMAIL AKUN AM PREMIUM:</label>
        <input type="email" id="activeEmail" placeholder="Belum ada akun terbuat...">
      </div>
      <button type="button" id="btnCopy" class="btn-secondary" onclick="copyEmail()">[ 📋 COPY EMAIL ]</button>
    </fieldset>

    <!-- INBOX VIEW -->
    <fieldset>
      <legend>Akses Inbox & Link Manual</legend>
      <button type="button" id="btnCheckInbox" class="btn-secondary" onclick="checkInboxManual()">[ 📥 CEK PESAN MASUK ]</button>
      <button type="button" id="btnProcessInbox" class="btn-action" onclick="processExistingInbox()">[ ⚡ PROSES DARI INBOX ]</button>
      <textarea id="inboxView" class="inbox-box" readonly>[ Klik 'CEK PESAN MASUK' untuk membaca email... ]</textarea>

      <div class="form-group" style="margin-top: 8px;">
        <label for="manualLink">LINK VERIFIKASI TERDETEKSI / PASTE:</label>
        <input type="text" id="manualLink" placeholder="https://alightcreative.com/auth_...">
      </div>
      <button type="button" id="btnManualVerif" class="btn-secondary" onclick="executeManualLink()">[ 🔑 AKTIFKAN LINK TERSEBUT ]</button>
    </fieldset>

    <!-- CONSOLE LOG -->
    <fieldset>
      <legend>Console Log</legend>
      <textarea id="consoleLog" class="output-box" readonly>[ Ready. Klik 'BUAT & AKTIFKAN AKUN' untuk mulai. ]</textarea>
    </fieldset>

    <div class="footer">
      System Automated &bull; adam.dev
    </div>
  </div>

  <script>
    var API_HOST = 'https://api.alwayscodex.eu.cc';

    function log(msg) {
      var consoleBox = document.getElementById('consoleLog');
      if (consoleBox) {
        consoleBox.value += "\n> " + msg;
        consoleBox.scrollTop = consoleBox.scrollHeight;
      }
    }

    // Bind Event Listener setelah Halaman Siap
    document.addEventListener('DOMContentLoaded', function() {
      var btnStart = document.getElementById('btnStart');
      if (btnStart) {
        btnStart.addEventListener('click', function(e) {
          e.preventDefault();
          startFullAutomation();
        });
      }
    });

    // Request API Multi-Fallback
    async function fetchData(endpoint) {
      var directUrl = API_HOST + endpoint;

      if (window.location.hostname.indexOf('vercel.app') !== -1) {
        try {
          var proxyPath = '/backend-api' + endpoint;
          var res1 = await fetch(proxyPath);
          if (res1.ok) {
            var text1 = await res1.text();
            try { return JSON.parse(text1); } catch(e) { return text1; }
          }
        } catch(e) {}
      }

      try {
        var res2 = await fetch(directUrl);
        if (res2.ok) {
          var text2 = await res2.text();
          try { return JSON.parse(text2); } catch(e) { return text2; }
        }
      } catch(e) {}

      try {
        var corsUrl = 'https://corsproxy.io/?' + encodeURIComponent(directUrl);
        var res3 = await fetch(corsUrl);
        if (res3.ok) {
          var text3 = await res3.text();
          try { return JSON.parse(text3); } catch(e) { return text3; }
        }
      } catch(e) {}

      throw new Error("Gagal terhubung ke API server.");
    }

    // Ekstraksi Link Verifikasi
    function extractLinkFromInbox(dataInbox) {
      if (!dataInbox) return null;
      var str = typeof dataInbox === 'string' ? dataInbox : JSON.stringify(dataInbox);

      str = str.replace(/\\\/g, '/')
               .replace(/\\"/g, '"')
               .replace(/\\n/g, ' ')
               .replace(/\\r/g, ' ')
               .replace(/=3D/gi, '=')
               .replace(/=\r?\n/g, '')
               .replace(/&amp;/g, '&');

      var urls = str.match(/https?:\/\/[^\s"'<>]+/gi) || [];

      for (var i = 0; i < urls.length; i++) {
        var clean = urls[i].replace(/[";,>)\.]+$/, '');
        var lower = clean.toLowerCase();

        if ((lower.indexOf('alight') !== -1 || lower.indexOf('firebase') !== -1 || lower.indexOf('oobcode') !== -1 || lower.indexOf('auth') !== -1) &&
            lower.indexOf('alwayscodex') === -1 && lower.indexOf('1timetech') === -1 && lower.indexOf('vercel') === -1) {
          return clean;
        }
      }
      return null;
    }

    // FUNGSI UTAMA AUTOMATION
    async function startFullAutomation() {
      var btn = document.getElementById('btnStart');
      var emailInput = document.getElementById('activeEmail');

      if (!btn) return;

      // Respon visual langsung saat ditekan
      btn.disabled = true;
      btn.innerText = "[ ⏳ SEDANG MEMPROSES... ]";
      log("Tombol ditekan! Memulai proses...");

      try {
        // Step 1: Create Email
        log("[1/4] Membuat temp email...");
        var data1 = await fetchData('/api/tempmail/1timetech?action=create');
        
        var createdEmail = null;
        if (typeof data1 === 'object' && data1 !== null) {
          if (data1.result && data1.result.email) createdEmail = data1.result.email;
          else if (data1.email) createdEmail = data1.email;
        }

        if (!createdEmail) throw new Error("Gagal membuat email temporary.");

        emailInput.value = createdEmail;
        log("[1/4] Email berhasil dibuat: " + createdEmail);

        // Step 2: Request Link
        log("[2/4] Mengirim request verifikasi ke Alight Motion...");
        await fetchData('/api/am/sendv2?email=' + encodeURIComponent(createdEmail));
        log("[2/4] Request verifikasi terkirim!");

        // Step 3: Poll Inbox
        log("[3/4] Menunggu pesan masuk (auto-check 8x)...");
        var foundLink = null;
        var attempts = 0;

        while (attempts < 8 && !foundLink) {
          attempts++;
          await new Promise(function(r) { setTimeout(r, 3000); });

          try {
            var dataInbox = await fetchData('/api/tempmail/1timetech?action=inbox&email=' + encodeURIComponent(createdEmail));
            document.getElementById('inboxView').value = typeof dataInbox === 'object' ? JSON.stringify(dataInbox, null, 2) : dataInbox;

            foundLink = extractLinkFromInbox(dataInbox);

            if (foundLink) {
              log("[3/4] Link verifikasi berhasil ditemukan!");
              document.getElementById('manualLink').value = foundLink;
            } else {
              log("[3/4] Check ke-" + attempts + "/8... membaca inbox.");
            }
          } catch(e) {
            log("[3/4] Check ke-" + attempts + "... mengulang.");
          }
        }

        if (!foundLink) {
          log("⚠️ Auto-check selesai. Jika email masuk, klik '[ ⚡ PROSES DARI INBOX ]'.");
          return;
        }

        // Step 4: Activate
        await executeActivation(createdEmail, foundLink);

      } catch(err) {
        log("❌ ERROR: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "[ 🚀 BUAT & AKTIFKAN AKUN ]";
      }
    }

    async function checkInboxManual() {
      var email = document.getElementById('activeEmail').value.trim();
      var inboxView = document.getElementById('inboxView');

      if (!email) return alert("Isi atau buat email terlebih dahulu!");

      inboxView.value = "Memuat isi inbox...";
      log("Mengecek inbox...");

      try {
        var data = await fetchData('/api/tempmail/1timetech?action=inbox&email=' + encodeURIComponent(email));
        inboxView.value = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;

        var link = extractLinkFromInbox(data);
        if (link) {
          document.getElementById('manualLink').value = link;
          log("Link verifikasi terdeteksi!");
        }
      } catch(err) {
        inboxView.value = "Gagal membaca inbox.";
        log("❌ ERROR: " + err.message);
      }
    }

    async function processExistingInbox() {
      var email = document.getElementById('activeEmail').value.trim();
      var btn = document.getElementById('btnProcessInbox');

      if (!email) return alert("Isi atau buat email terlebih dahulu!");

      btn.disabled = true;
      btn.innerText = "[ ⏳ MEMPROSES... ]";

      try {
        var dataInbox = await fetchData('/api/tempmail/1timetech?action=inbox&email=' + encodeURIComponent(email));
        document.getElementById('inboxView').value = typeof dataInbox === 'object' ? JSON.stringify(dataInbox, null, 2) : dataInbox;

        var foundLink = extractLinkFromInbox(dataInbox);
        if (!foundLink) throw new Error("Link belum terdeteksi. Silakan tekan 'CEK PESAN MASUK'.");

        document.getElementById('manualLink').value = foundLink;
        await executeActivation(email, foundLink);

      } catch(err) {
        log("❌ ERROR: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "[ ⚡ PROSES DARI INBOX ]";
      }
    }

    async function executeManualLink() {
      var email = document.getElementById('activeEmail').value.trim();
      var link = document.getElementById('manualLink').value.trim();

      if (!email || !link) return alert("Email dan Link verifikasi wajib diisi!");

      log("Memproses aktivasi via link...");
      await executeActivation(email, link);
    }

    async function executeActivation(email, link) {
      log("[4/4] Memproses aktivasi Premium...");
      var verifEndpoint = '/api/am/verifv2?email=' + encodeURIComponent(email) + '&link=' + encodeURIComponent(link);

      try {
        await fetchData(verifEndpoint);
      } catch(e) {
        await fetch(API_HOST + verifEndpoint, { mode: 'no-cors' });
      }

      log("==========================================");
      log("🎉 SUKSES! AKUN PREMIUM BERHASIL AKTIF!");
      log("==========================================");
    }

    function copyEmail() {
      var emailInput = document.getElementById('activeEmail');
      if (!emailInput.value) return alert("Email kosong!");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(emailInput.value);
      } else {
        emailInput.select();
        document.execCommand('copy');
      }
      alert("Email berhasil di-copy!");
    }
  </script>
</body>
</html>
